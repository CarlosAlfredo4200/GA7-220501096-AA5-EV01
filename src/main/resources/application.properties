spring.application.name=auth-api-sena

# ===============================
# CONEXIÓN SQL SERVER
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:14330;databaseName=auth_sena;encrypt=true;trustServerCertificate=true
spring.datasource.username=usuario_papeleria
spring.datasource.password=${PAPELERIA_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# SERVIDOR
# ===============================
server.port=8080
server.error.include-message=never
server.error.include-binding-errors=never
